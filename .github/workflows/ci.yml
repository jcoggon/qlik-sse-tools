name: CI

env:
  PYTHONUTF8: "1"

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            image: python:3.13.18-slim-bookworm@sha256:281d39ff02e3b389401586134ff9e6572954687822a58055ec07a60ded4e0b7f
          - os: windows-latest
          - os: macos-latest
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Select Windows downloader bootstrap only
        if: runner.os == 'Windows'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Stage exact private Windows Python
        if: runner.os == 'Windows'
        run: python scripts/prepare_windows_native_python.py --output "${{ runner.temp }}/sse-python-${{ github.job }}"
      - name: Install fixed Linux CI prerequisites
        if: runner.os == 'Linux'
        run: bash .github/scripts/linux-prerequisites.sh
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: runner.os == 'macOS'
        with:
          python-version: "3.13"
      - name: Install macOS native runtime
        if: runner.os == 'macOS'
        run: brew install libomp
      - run: >-
          python -m pip install --require-hashes --only-binary=:all: -r locks/bootstrap.lock
      - run: >-
          python -m pip install --require-hashes --only-binary=:all: -r locks/dev.lock
      - run: python -m pip check
      - run: python tests/test_all_tools.py
      - run: python -m pytest tests/test_registry.py tests/test_version.py tests/test_server_bind.py tests/test_server_integration.py tests/test_llm_responses.py tests/test_sdk_compatibility.py tests/test_statsforecast_extensions.py tests/test_cloud_api.py
      - run: python -m pytest tests/test_security.py tests/test_supply_chain.py tests/test_pillow_bundle.py
      - run: python -m ruff check core/_security.py scripts/provision.py scripts/export_locks.py scripts/pillow_native.py scripts/pillow_windows.py tests/test_security.py tests/test_keras_security.py tests/test_supply_chain.py tests/test_pillow_bundle.py tests/qualify_windows_bundle.py scripts/pillow_bundle.py scripts/approve_pillow_bundle.py scripts/prepare_windows_native_python.py
      - run: python -m ruff check core/_llm.py core/_statsforecast.py core/cloud_api.py core/_server_bind.py tests/test_server_bind.py tests/test_llm_responses.py tests/test_sdk_compatibility.py tests/test_statsforecast_extensions.py tests/test_cloud_api.py tests/test_server_integration.py
      - run: python -m ruff check --select F core/__main__.py core/_utils.py
      - run: python -m compileall -q core generated tests scripts
      - run: python scripts/package_sse.py --skip-tests --output-dir dist

  frozen-locks:
    runs-on: ubuntu-latest
    container: python:3.13.18-slim-bookworm@sha256:281d39ff02e3b389401586134ff9e6572954687822a58055ec07a60ded4e0b7f
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
      - run: uv run --no-project --python 3.13 scripts/export_locks.py --check

  native-security:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            image: python:3.13.18-slim-bookworm@sha256:281d39ff02e3b389401586134ff9e6572954687822a58055ec07a60ded4e0b7f
          - os: macos-latest
          - os: windows-latest
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Select Windows downloader bootstrap only
        if: runner.os == 'Windows'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Stage exact private Windows Python
        if: runner.os == 'Windows'
        run: python scripts/prepare_windows_native_python.py --output "${{ runner.temp }}/sse-python-${{ github.job }}"
      - name: Install fixed Linux CI prerequisites
        if: runner.os == 'Linux'
        run: bash .github/scripts/linux-prerequisites.sh
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: runner.os == 'macOS'
        with:
          python-version: "3.13"
      - name: Create isolated native qualification environment
        shell: bash
        run: |
          python -m venv .ci-env
          python -c 'import os, pathlib; p = pathlib.Path(".ci-env/Scripts" if os.name == "nt" else ".ci-env/bin").resolve(); open(os.environ["GITHUB_PATH"], "a").write(str(p) + "\n")'
      - run: >-
          python -m pip install --require-hashes --only-binary=:all: -r locks/bootstrap.lock
      - run: >-
          python -m pip install --require-hashes --only-binary=:all: -r locks/core.lock
      - name: Verify original Windows vendor wheel
        if: runner.os == 'Windows'
        run: python scripts/pillow_bundle.py inspect-original
      - run: python scripts/pillow_native.py --repair
      - run: python scripts/pillow_native.py
      - run: python -m pip check

      - name: Export Windows native test bundle
        if: runner.os == 'Windows'
        id: native-export
        run: python scripts/pillow_bundle.py export --output "${{ runner.temp }}/native-export"
      - name: Upload Windows native test artifact
        if: runner.os == 'Windows'
        id: native-upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.native-export.outputs.artifact_name }}
          path: |
            ${{ runner.temp }}/native-export/windows-native-bundle.zip
            ${{ runner.temp }}/native-export/producer-receipt.json
          if-no-files-found: error
          retention-days: 7
          overwrite: false
      - name: Download exact Windows native test artifact
        if: runner.os == 'Windows'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ steps.native-upload.outputs.artifact-id }}
          merge-multiple: true
          path: ${{ runner.temp }}/native-downloaded
      - name: Create fresh original Windows consumer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "${{ runner.temp }}/sse-python-native-security/python/python.exe" -m venv .ci-consumer
          python -m pip --python .ci-consumer/Scripts/python.exe install --require-hashes --only-binary=:all: -r locks/bootstrap.lock -r locks/core.lock
      - name: Qualify explicit Windows native bundle
        if: runner.os == 'Windows'
        env:
          NATIVE_DOWNLOADED: ${{ runner.temp }}/native-downloaded
          NATIVE_ARTIFACT_ID: ${{ steps.native-upload.outputs.artifact-id }}
          NATIVE_ARTIFACT_DIGEST: ${{ steps.native-upload.outputs.artifact-digest }}
          NATIVE_BUNDLE_SHA256: ${{ steps.native-export.outputs.bundle_sha256 }}
        run: .ci-consumer/Scripts/python.exe tests/qualify_windows_bundle.py

  deep-learning:
    runs-on: ubuntu-latest
    container: python:3.13.18-slim-bookworm@sha256:281d39ff02e3b389401586134ff9e6572954687822a58055ec07a60ded4e0b7f
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - run: bash .github/scripts/linux-prerequisites.sh
      - run: >-
          python -m pip install --require-hashes --only-binary=:all: -r locks/bootstrap.lock
      - run: >-
          python -m pip install --require-hashes --only-binary=:all: -r locks/dev.lock -r locks/deep-learning.lock
      - run: python -m pip check
      - run: python -m pytest tests/test_keras_security.py

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: >-
          python -m pip install --require-hashes --only-binary=:all: -r locks/bootstrap.lock
      - run: >-
          python -m pip install --require-hashes --only-binary=:all: -r locks/dev.lock
      - run: python -m pip_audit --strict --no-deps --disable-pip -r locks/core.lock
      - run: python -m pip_audit --strict --no-deps --disable-pip -r locks/cloud.lock
      - run: python -m pip_audit --strict --no-deps --disable-pip -r locks/deep-learning.lock
      - run: python -m pip_audit --strict --no-deps --disable-pip -r locks/dev.lock
      - run: python -m pip_audit --strict --no-deps --disable-pip -r locks/notebooks.lock
      - run: python -m pip_audit --strict --no-deps --disable-pip -r locks/visualization.lock
      - run: python -m pip_audit --strict --no-deps --disable-pip -r locks/transformers.lock
      - run: python -m pip_audit --strict --no-deps --disable-pip -r locks/bootstrap.lock

  optional-extras:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Select Windows downloader bootstrap only
        if: runner.os == 'Windows'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Stage exact private Windows Python
        if: runner.os == 'Windows'
        run: python scripts/prepare_windows_native_python.py --output "${{ runner.temp }}/sse-python-${{ github.job }}"
      - run: >-
          python -m pip install --require-hashes --only-binary=:all: -r locks/bootstrap.lock
      - run: >-
          python -m pip install --require-hashes --only-binary=:all: -r locks/notebooks.lock -r locks/visualization.lock -r locks/transformers.lock
      - run: python -m pip check
      - run: python scripts/smoke_extras.py

  python-314-compatibility-probe:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
      - run: uv pip compile --python 3.14 requirements.txt -o /tmp/qlik-py-tools-314.txt
