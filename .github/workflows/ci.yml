name: CI

env:
  PYTHONUTF8: "1"

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install macOS native runtime
        if: runner.os == 'macOS'
        run: brew install libomp
      - run: >-
          python -m pip install --require-hashes --only-binary=:all: -r locks/bootstrap.lock
      - run: >-
          python -m pip install --require-hashes --only-binary=:all: -r locks/dev.lock
      - run: python -m pip check
      - run: python tests/test_all_tools.py
      - run: python -m pytest tests/test_registry.py tests/test_version.py tests/test_server_integration.py tests/test_llm_responses.py tests/test_statsforecast_extensions.py tests/test_cloud_api.py
      - run: python -m pytest tests/test_security.py tests/test_supply_chain.py
      - run: python -m ruff check core/_security.py scripts/provision.py scripts/export_locks.py scripts/pillow_native.py tests/test_security.py tests/test_keras_security.py tests/test_supply_chain.py
      - run: python -m ruff check core/_llm.py core/_statsforecast.py core/cloud_api.py tests/test_llm_responses.py tests/test_statsforecast_extensions.py tests/test_cloud_api.py tests/test_server_integration.py
      - run: python -m ruff check --select F core/__main__.py core/_utils.py
      - run: python -m compileall -q core generated tests scripts
      - run: python scripts/package_sse.py --skip-tests --output-dir dist

  frozen-locks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.12"
      - run: uv run --no-project --python 3.13 scripts/export_locks.py --check

  native-security:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: >-
          python -m pip install --require-hashes --only-binary=:all: -r locks/bootstrap.lock
      - run: >-
          python -m pip install --require-hashes --only-binary=:all: -r locks/core.lock
      - run: python scripts/pillow_native.py --repair
      - run: python scripts/pillow_native.py
      - run: python -m pip check

  deep-learning:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: >-
          python -m pip install --require-hashes --only-binary=:all: -r locks/bootstrap.lock
      - run: >-
          python -m pip install --require-hashes --only-binary=:all: -r locks/dev.lock -r locks/deep-learning.lock
      - run: python -m pip check
      - run: python -m pytest tests/test_keras_security.py

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: >-
          python -m pip install --require-hashes --only-binary=:all: -r locks/bootstrap.lock
      - run: >-
          python -m pip install --require-hashes --only-binary=:all: -r locks/dev.lock
      - run: python -m pip_audit --strict --no-deps --disable-pip -r locks/core.lock
      - run: python -m pip_audit --strict --no-deps --disable-pip -r locks/cloud.lock
      - run: python -m pip_audit --strict --no-deps --disable-pip -r locks/deep-learning.lock
      - run: python -m pip_audit --strict --no-deps --disable-pip -r locks/dev.lock

  python-314-compatibility-probe:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv pip compile --python 3.14 requirements.txt -o /tmp/qlik-py-tools-314.txt
