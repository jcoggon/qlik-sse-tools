[build-system]
requires = ["setuptools==84.2.1", "wheel==0.47.0"]
build-backend = "setuptools.build_meta"

[project]
name = "raptor-qlik-sse-tools"
description = "Modern Python analytics, forecasting, ML, and AI tools for Qlik SSE"
readme = "README.md"
requires-python = ">=3.13.18,<3.14"
license = "MIT"
dynamic = ["version", "dependencies"]

[project.optional-dependencies]
deep-learning = [
  "tensorflow==2.21.0",
  "keras==3.15.0",
  "scikeras==0.13.0",
  "h5py==3.14.0",
]
cloud = [
  "fastapi==0.139.0",
  "starlette==1.3.1",
  "uvicorn[standard]==0.51.0",
]
dev = [
  "grpcio-tools==1.82.1",
  "pytest==9.0.3",
  "pytest-cov==7.0.0",
  "ruff==0.14.13",
  "pip-audit==2.10.0",
  "pip==26.2.2",
  "filelock==4.2.1",
  "msgpack==1.2.3",
  "httpx==0.28.1",
]

[tool.setuptools.dynamic]
version = {attr = "core._version.__version__"}
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
include = ["core", "generated"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py313"
line-length = 120
extend-exclude = ["generated", "qlik-py-env"]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]

[tool.uv]
cache-keys = [{file = "pyproject.toml"}, {file = "requirements*.txt"}]
